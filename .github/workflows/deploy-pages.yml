# Publikacja strony fundacji (website/) na GitHub Pages.
# Wymaga: Settings → Pages → Source: "GitHub Actions" (już włączone).
#
# TRYB WYŁĄCZNIE RĘCZNY — decyzja właścicielki fundacji: strona NIE publikuje się
# automatycznie przy zmianach. Publikacja tylko przez świadome uruchomienie
# (zakładka Actions → "Run workflow" lub na wyraźne polecenie w sesji Claude).
# Po decyzji o starciu produkcyjnym można przywrócić trigger "push".
name: Deploy strony na GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
