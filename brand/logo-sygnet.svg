  <!-- sieć neuronów / "iskra AI" -->
  <g stroke="url(#gold)" stroke-width="3" fill="none" opacity="0.95">
    <line x1="250" y1="120" x2="255" y2="55"/>
    <line x1="250" y1="120" x2="210" y2="80"/>
    <line x1="250" y1="120" x2="300" y2="95"/>
    <line x1="250" y1="120" x2="195" y2="135"/>
    <line x1="250" y1="120" x2="310" y2="150"/>
    <line x1="250" y1="120" x2="215" y2="175"/>
    <line x1="250" y1="120" x2="280" y2="185"/>
    <line x1="210" y1="80" x2="195" y2="135"/>
    <line x1="300" y1="95" x2="310" y2="150"/>
    <line x1="215" y1="175" x2="280" y2="185"/>
  </g>
  <g fill="url(#nodeGlow)">
    <circle cx="250" cy="120" r="20"/>
    <circle cx="255" cy="55" r="12"/>
    <circle cx="210" cy="80" r="9"/>
    <circle cx="300" cy="95" r="10"/>
    <circle cx="195" cy="135" r="8"/>
    <circle cx="310" cy="150" r="8"/>
    <circle cx="215" cy="175" r="11"/>
    <circle cx="280" cy="185" r="7"/>
