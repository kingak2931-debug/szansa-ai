<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Fundacja Szansa AI — sygnet (styl premium/Axonise)</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.15" stop-color="#f7dfa0"/>
      <stop offset="0.32" stop-color="#d9a53a"/>
      <stop offset="0.48" stop-color="#fff3d0"/>
      <stop offset="0.65" stop-color="#b9791d"/>
      <stop offset="1" stop-color="#5c3d0d"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="0.25" stop-color="#ffe9ab"/>
      <stop offset="0.5" stop-color="#eeb43e"/>
      <stop offset="0.75" stop-color="#b3791c"/>
      <stop offset="1" stop-color="#6b4610"/>
    </radialGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#e8bd68"/>
      <stop offset="0.4" stop-color="#a8701f"/>
      <stop offset="0.7" stop-color="#7a4f14"/>
      <stop offset="1" stop-color="#3a2508"/>
    </linearGradient>
