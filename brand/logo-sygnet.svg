  <g stroke="#f0c14b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3">
    <path d="M120 264 L120 320"/>
    <path d="M120 320 L98 378"/>
    <path d="M120 320 L145 378"/>
    <path d="M120 278 L88 305"/>
    <path d="M120 278 L182 213"/>
  </g>
  <circle cx="120" cy="245" r="19" fill="url(#bronze)" stroke="#f0c14b" stroke-width="2"/>
  <g stroke="url(#bronze)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120 264 L120 320"/>
    <path d="M120 320 L98 378"/>
    <path d="M120 320 L145 378"/>
    <path d="M120 278 L88 305"/>
    <path d="M120 278 L182 213"/>
  </g>

  <!-- linia gruntu -->
  <path d="M75 388 Q120 405 165 388" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
