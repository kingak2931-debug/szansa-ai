    <line x1="250" y1="120" x2="210" y2="80"/>
    <line x1="250" y1="120" x2="300" y2="95"/>
    <line x1="250" y1="120" x2="195" y2="135"/>
    <line x1="250" y1="120" x2="310" y2="150"/>
